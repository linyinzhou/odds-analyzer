name: Manual report refresh

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: "Refresh type"
        required: true
        default: "evening-report"
        type: choice
        options:
          - evening-report
          - result-review
      slate_date:
        description: "Optional slate date, Asia/Shanghai YYYY-MM-DD"
        required: false
        type: string
      note:
        description: "Optional operator note"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: manual-report-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show manual trigger context
        run: |
          echo "run_type=${{ inputs.run_type }}"
          echo "slate_date=${{ inputs.slate_date }}"
          echo "note=${{ inputs.note }}"
          echo "TODO: replace this placeholder with the deterministic report-generation job once live source adapters are wired."

      - name: Validate dashboard data
        run: python -m json.tool dashboard/data/daily_matches.json > /dev/null

      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Write run status
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          status = {
              "status": "success",
              "trigger": "workflow_dispatch",
              "run_type": os.environ.get("RUN_TYPE", "manual-report"),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commit": os.environ["GITHUB_SHA"][:7],
              "branch": os.environ["GITHUB_REF_NAME"],
              "actor": os.environ["GITHUB_ACTOR"],
              "updated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "note": os.environ.get("RUN_NOTE", ""),
          }
          with open("dashboard/data/run_status.json", "w", encoding="utf-8") as fh:
              json.dump(status, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          PY
        env:
          RUN_TYPE: ${{ inputs.run_type }}
          RUN_NOTE: ${{ inputs.note }}

      - name: Publish dashboard to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix dashboard -b gh-pages-deploy
          git push -f origin gh-pages-deploy:gh-pages

