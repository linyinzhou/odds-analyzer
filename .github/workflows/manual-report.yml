name: Manual report refresh

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: "Refresh type"
        required: true
        default: "evening-report"
        type: choice
        options:
          - evening-report
          - result-review
      slate_date:
        description: "Optional slate date, Asia/Shanghai YYYY-MM-DD"
        required: false
        type: string
      note:
        description: "Optional operator note"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dashboard-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore latest live report data
        run: |
          git fetch origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages || true
          if git show origin/gh-pages:data/daily_matches.json > /tmp/daily_matches.json; then
            cp /tmp/daily_matches.json dashboard/data/daily_matches.json
          fi

      - name: Show manual trigger context
        run: |
          echo "run_type=${{ inputs.run_type }}"
          echo "slate_date=${{ inputs.slate_date }}"
          echo "note=${{ inputs.note }}"
          echo "Dispatch accepted."

      - name: Refresh evening slate
        if: ${{ inputs.run_type == 'evening-report' }}
        run: PYTHONPATH=src python -m odds_analyzer.jobs.refresh_evening_slate --date "${SLATE_DATE}"
        env:
          SLATE_DATE: ${{ inputs.slate_date }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      - name: Validate dashboard data
        run: python -m json.tool dashboard/data/daily_matches.json > /dev/null

      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Write run status
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          status = {
              "status": "success",
              "trigger": "workflow_dispatch",
              "run_type": os.environ.get("RUN_TYPE", "manual-report"),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commit": os.environ["GITHUB_SHA"][:7],
              "branch": os.environ["GITHUB_REF_NAME"],
              "actor": os.environ["GITHUB_ACTOR"],
              "updated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "note": os.environ.get("RUN_NOTE", ""),
          }
          with open("dashboard/data/run_status.json", "w", encoding="utf-8") as fh:
              json.dump(status, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          PY
        env:
          RUN_TYPE: ${{ inputs.run_type }}
          RUN_NOTE: ${{ inputs.note }}

      - name: Publish dashboard to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/odds-analyzer-dashboard
          mkdir -p /tmp/odds-analyzer-dashboard
          cp -R dashboard/. /tmp/odds-analyzer-dashboard/
          git checkout --orphan gh-pages-deploy
          git rm -rf .
          cp -R /tmp/odds-analyzer-dashboard/. .
          git add .
          git commit -m "Deploy dashboard from ${GITHUB_RUN_ID}"
          git push -f origin gh-pages-deploy:gh-pages
