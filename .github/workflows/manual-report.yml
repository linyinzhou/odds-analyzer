name: Manual report refresh

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      run_type:
        description: "Refresh type"
        required: true
        default: "evening-report"
        type: choice
        options:
          - evening-report
          - result-review
          - adhoc-report
      slate_date:
        description: "Optional slate date, Asia/Shanghai YYYY-MM-DD"
        required: false
        type: string
      analysis_competitions:
        description: "Optional analysis codes: PL or PL,PD,SA,BL1,FL1,CL"
        required: false
        type: string
      adhoc_date:
        description: "Ad hoc match date, Asia/Shanghai YYYY-MM-DD"
        required: false
        type: string
      home_team:
        description: "Ad hoc home team"
        required: false
        type: string
      away_team:
        description: "Ad hoc away team"
        required: false
        type: string
      competition_label:
        description: "Optional competition label, e.g. Eredivisie"
        required: false
        type: string
      kickoff_time:
        description: "Optional kickoff time, e.g. 20:00"
        required: false
        type: string
      odds_sport_key:
        description: "Optional The Odds API sport key, e.g. soccer_netherlands_eredivisie"
        required: false
        type: string
      note:
        description: "Optional operator note"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dashboard-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore latest live report data
        run: |
          git fetch origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages || true
          if git show origin/gh-pages:data/daily_matches.json > /tmp/daily_matches.json; then
            cp /tmp/daily_matches.json dashboard/data/daily_matches.json
          fi

      - name: Show manual trigger context
        run: |
          echo "run_type=${{ inputs.run_type }}"
          echo "slate_date=${{ inputs.slate_date }}"
          echo "analysis_competitions=${{ inputs.analysis_competitions }}"
          echo "adhoc_date=${{ inputs.adhoc_date }}"
          echo "home_team=${{ inputs.home_team }}"
          echo "away_team=${{ inputs.away_team }}"
          echo "competition_label=${{ inputs.competition_label }}"
          echo "kickoff_time=${{ inputs.kickoff_time }}"
          echo "odds_sport_key=${{ inputs.odds_sport_key }}"
          echo "note=${{ inputs.note }}"
          echo "Dispatch accepted."

      - name: Refresh evening slate
        if: ${{ github.event.schedule == '0 10 * * *' || inputs.run_type == 'evening-report' }}
        run: PYTHONPATH=src python -m odds_analyzer.jobs.refresh_evening_slate --date "${SLATE_DATE}"
        env:
          SLATE_DATE: ${{ inputs.slate_date }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_API_KEY }}
          ANALYSIS_COMPETITIONS: ${{ inputs.analysis_competitions || 'PL,PD,SA' }}
      - name: Review checker results
        if: ${{ github.event.schedule == '0 0 * * *' || inputs.run_type == 'result-review' }}
        run: PYTHONPATH=src python -m odds_analyzer.jobs.review_results --date "${SLATE_DATE}"
        env:
          SLATE_DATE: ${{ inputs.slate_date }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      - name: Generate ad hoc match report
        if: ${{ inputs.run_type == 'adhoc-report' }}
        run: |
          if [ -z "$ADHOC_DATE" ] || [ -z "$HOME_TEAM" ] || [ -z "$AWAY_TEAM" ]; then
            echo "adhoc_date, home_team and away_team are required for adhoc-report."
            exit 1
          fi
          PYTHONPATH=src python -m odds_analyzer.jobs.refresh_adhoc_match \
            --date "$ADHOC_DATE" \
            --home "$HOME_TEAM" \
            --away "$AWAY_TEAM" \
            --competition "$COMPETITION_LABEL" \
            --kickoff "$KICKOFF_TIME" \
            --odds-sport-key "$ODDS_SPORT_KEY"
        env:
          ADHOC_DATE: ${{ inputs.adhoc_date }}
          HOME_TEAM: ${{ inputs.home_team }}
          AWAY_TEAM: ${{ inputs.away_team }}
          COMPETITION_LABEL: ${{ inputs.competition_label }}
          KICKOFF_TIME: ${{ inputs.kickoff_time }}
          ODDS_SPORT_KEY: ${{ inputs.odds_sport_key }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      - name: Validate dashboard data
        run: python -m json.tool dashboard/data/daily_matches.json > /dev/null

      - name: Summarize fallback queue
        run: |
          python - <<'PY'
          import json
          import os
          with open("dashboard/data/daily_matches.json", encoding="utf-8") as fh:
              payload = json.load(fh)
          pending = [item for item in payload.get("fallback_requests", []) if item.get("status") == "pending"]
          lines = ["## API fallback queue", "", f"Pending Codex search tasks: **{len(pending)}**"]
          for item in pending[:20]:
              fields = ", ".join(item.get("missing_fields", []))
              lines.append(f"- {item.get('home_team')} vs {item.get('away_team')}: {fields}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Run tests
        run: |
          cp dashboard/data/daily_matches.json /tmp/generated_daily_matches.json
          git checkout -- dashboard/data/daily_matches.json
          PYTHONPATH=src python -m unittest discover -s tests
          cp /tmp/generated_daily_matches.json dashboard/data/daily_matches.json

      - name: Write run status
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          status = {
              "status": "success",
              "trigger": os.environ.get("RUN_TRIGGER", "workflow_dispatch"),
              "run_type": os.environ.get("RUN_TYPE", "manual-report"),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commit": os.environ["GITHUB_SHA"][:7],
              "branch": os.environ["GITHUB_REF_NAME"],
              "actor": os.environ["GITHUB_ACTOR"],
              "updated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "note": os.environ.get("RUN_NOTE", ""),
              "analysis_competitions": os.environ.get("RUN_ANALYSIS_COMPETITIONS", "PL,PD,SA"),
          }
          with open("dashboard/data/run_status.json", "w", encoding="utf-8") as fh:
              json.dump(status, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          PY
        env:
          RUN_TYPE: ${{ github.event.schedule == '0 0 * * *' && 'result-review' || github.event.schedule == '0 10 * * *' && 'evening-report' || inputs.run_type }}
          RUN_TRIGGER: ${{ github.event_name }}
          RUN_NOTE: ${{ inputs.note }}
          RUN_ANALYSIS_COMPETITIONS: ${{ inputs.analysis_competitions || 'PL,PD,SA' }}

      - name: Publish dashboard to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/odds-analyzer-dashboard
          mkdir -p /tmp/odds-analyzer-dashboard
          cp -R dashboard/. /tmp/odds-analyzer-dashboard/
          git checkout --orphan gh-pages-deploy
          git rm -rf .
          cp -R /tmp/odds-analyzer-dashboard/. .
          git add .
          git commit -m "Deploy dashboard from ${GITHUB_RUN_ID}"
          git push -f origin gh-pages-deploy:gh-pages
