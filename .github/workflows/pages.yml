name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preserve latest live report data
        run: |
          git fetch origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages || true
          if git show origin/gh-pages:data/daily_matches.json > /tmp/daily_matches.json; then
            python - <<'PY'
          import json
          from pathlib import Path

          main_path = Path("dashboard/data/daily_matches.json")
          live_path = Path("/tmp/daily_matches.json")
          main = json.loads(main_path.read_text(encoding="utf-8"))
          live = json.loads(live_path.read_text(encoding="utf-8"))

          def quality(payload):
              fields = ("european_odds", "asian_handicap", "chinese_lottery")
              return sum(
                  sum(bool(match.get(field)) for field in fields)
                  + bool(match.get("fundamental_context") or match.get("fundamentals"))
                  for match in payload.get("current_matches", [])
              )

          main_date = str((main.get("slate") or {}).get("date") or "")
          live_date = str((live.get("slate") or {}).get("date") or "")
          use_live = live_date > main_date or (
              live_date == main_date and quality(live) >= quality(main)
          )
          if use_live:
              main_path.write_text(
                  json.dumps(live, ensure_ascii=False, indent=2) + chr(10),
                  encoding="utf-8",
              )
          print(
              f"restore_source={'gh-pages' if use_live else 'main'} "
              f"main={main_date}/{quality(main)} live={live_date}/{quality(live)}"
          )
          PY
          fi
          if git show origin/gh-pages:data/run_status.json > /tmp/run_status.json; then
            cp /tmp/run_status.json dashboard/data/run_status.json
          fi

      - name: Validate dashboard data
        run: python -m json.tool dashboard/data/daily_matches.json > /dev/null

      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Publish dashboard to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/odds-analyzer-dashboard
          mkdir -p /tmp/odds-analyzer-dashboard
          cp -R dashboard/. /tmp/odds-analyzer-dashboard/
          git checkout --orphan gh-pages-deploy
          git rm -rf .
          cp -R /tmp/odds-analyzer-dashboard/. .
          git add .
          git commit -m "Deploy dashboard from ${GITHUB_RUN_ID}"
          git push -f origin gh-pages-deploy:gh-pages
