name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate dashboard data
        run: python -m json.tool dashboard/data/daily_matches.json > /dev/null

      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Write run status
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          status = {
              "status": "success",
              "trigger": os.environ["GITHUB_EVENT_NAME"],
              "run_type": "pages-deploy",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commit": os.environ["GITHUB_SHA"][:7],
              "branch": os.environ["GITHUB_REF_NAME"],
              "actor": os.environ["GITHUB_ACTOR"],
              "updated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "note": "Automatic dashboard publish.",
          }
          with open("dashboard/data/run_status.json", "w", encoding="utf-8") as fh:
              json.dump(status, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          PY

      - name: Publish dashboard to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/odds-analyzer-dashboard
          mkdir -p /tmp/odds-analyzer-dashboard
          cp -R dashboard/. /tmp/odds-analyzer-dashboard/
          git checkout --orphan gh-pages-deploy
          git rm -rf .
          cp -R /tmp/odds-analyzer-dashboard/. .
          git add .
          git commit -m "Deploy dashboard from ${GITHUB_RUN_ID}"
          git push -f origin gh-pages-deploy:gh-pages

